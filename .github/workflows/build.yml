name: Android Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      id: java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Export JAVA_HOME
      run: echo "JAVA_HOME=${{ steps.java.outputs.java-home }}" >> "$GITHUB_ENV"

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        cmake: 3.22.1
        ndk: 25.1.8937393

    - name: Neutralize inherited agent JARs
      run: |
        rm -rf lib/agents .gradle/agents "$GRADLE_USER_HOME/agents"
        env | sort

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Verify Gradle
      run: ./gradlew --version

    - name: Build with Gradle
      run: ./gradlew clean assembleDebug --no-daemon --stacktrace
